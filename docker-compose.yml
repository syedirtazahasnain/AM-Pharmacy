version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: am-pharmacy-app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - ./storage:/var/www/storage
      - ./public:/var/www/public
      - ./bootstrap/cache:/var/www/bootstrap/cache
    networks:
      - am-pharmacy-network
    environment:
      - APP_ENV=production
      - APP_DEBUG=false
      - APP_URL=http://31.97.111.241:3002
      - DB_CONNECTION=mysql
      - DB_HOST=31.97.111.241
      - DB_PORT=3306
      - DB_DATABASE=${DB_DATABASE}
      - DB_USERNAME=${DB_USERNAME}
      - DB_PASSWORD=${DB_PASSWORD}
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M
        reservations:
          cpus: '0.5'
          memory: 256M

  webserver:
    image: nginx:alpine
    container_name: am-pharmacy-nginx
    restart: unless-stopped
    ports:
      - "3002:80"
    volumes:
      - ./public:/var/www/public
      - ./storage:/var/www/storage
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - am-pharmacy-network
    depends_on:
      - app
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.25'
          memory: 128M

networks:
  am-pharmacy-network:
    driver: bridge

