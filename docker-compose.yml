# /var/www/AM-Pharmacy/docker-compose.yml
version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: am-pharmacy-app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - ./storage:/var/www/storage
      - ./public:/var/www/public
      - ./bootstrap/cache:/var/www/bootstrap/cache
    networks:
      - am-pharmacy-network
    environment:
      - APP_ENV=production
      - APP_DEBUG=false
      - APP_URL=http://31.97.111.241:3002
      - DB_CONNECTION=mysql
      - DB_HOST=db
      - DB_PORT=3306
      - DB_DATABASE=${DB_DATABASE}
      - DB_USERNAME=${DB_USERNAME}
      - DB_PASSWORD=${DB_PASSWORD}
    depends_on:
      - db
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M
        reservations:
          cpus: '0.5'
          memory: 256M

  webserver:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    container_name: am-pharmacy-nginx
    restart: unless-stopped
    ports:
      - "3002:80"
    volumes:
      - ./public:/var/www/public
      - ./storage:/var/www/storage
    networks:
      - am-pharmacy-network
    depends_on:
      - app
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.25'
          memory: 128M

  db:
    image: mysql:8.0
    container_name: am-pharmacy-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
    ports:
      - "3308:3306"
    volumes:
      - household_db_data:/var/lib/mysql
    networks:
      - am-pharmacy-network
    command: --default-authentication-plugin=mysql_native_password
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 512M

  redis:
    image: redis:alpine
    container_name: am-pharmacy-redis
    restart: unless-stopped
    ports:
      - "6381:6379"
    networks:
      - am-pharmacy-network
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 128M
        reservations:
          cpus: '0.1'
          memory: 64M

networks:
  am-pharmacy-network:
    driver: bridge

volumes:
  household_db_data:
